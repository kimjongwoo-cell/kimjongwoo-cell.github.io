name: Update Citations

on:
  schedule:
    - cron: '0 3 * * 1'  # every Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Fetch citation counts from OpenAlex
      run: python3 scripts/update_citations.py
    - name: Commit if counts changed
      run: |
        git diff --quiet -I '"updated"' _data/citations.json && exit 0
        git config user.name github-actions[bot]
        git config user.email 41898282+github-actions[bot]@users.noreply.github.com
        git commit -am "Update citation counts"
        git push
